<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="جناح معرض بجدار شعار مضيء وكاونتر استقبال">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071628"/>
      <stop offset="1" stop-color="#11345C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174273"/>
      <stop offset=".55" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#0F3054"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CFDA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="truss" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24L12 0l12 24" fill="none" stroke="#8D96AB" stroke-width="2"/>
    </pattern>
    <pattern id="truss-v" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <path d="M0 24L12 0l12 24" fill="none" stroke="#8D96AB" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- شعار بأسلوب الخط الكوفي المربع -->
    <g id="logo">
      <rect x="290" y="232" width="220" height="14" rx="3"/>
      <rect x="294" y="172" width="16" height="74" rx="3"/>
      <rect x="332" y="204" width="32" height="42" rx="5"/>
      <rect x="386" y="186" width="16" height="60" rx="3"/>
      <rect x="424" y="204" width="32" height="42" rx="5"/>
      <rect x="490" y="172" width="16" height="74" rx="3"/>
      <circle cx="348" cy="186" r="7"/>
      <circle cx="440" cy="186" r="7"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#hall)"/>

  <!-- الجدار الخلفي للجناح -->
  <rect x="130" y="120" width="540" height="350" fill="#208EC1"/>
  <path d="M265 120v350M400 120v350M535 120v350" stroke="#176E99" stroke-width="4"/>

  <!-- إضاءة الكشافات على الجدار -->
  <path d="M220 112l-62 220h124zM350 112l-62 220h124zM450 112l-62 220h124zM580 112l-62 220h124z" fill="url(#beam)"/>

  <!-- الشعار المضيء: الجوانب ثم الوجه -->
  <use href="#logo" transform="translate(-6 6)" fill="#11345C"/>
  <use href="#logo" transform="translate(-3 3)" fill="#176E99"/>
  <use href="#logo" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- رفوف عرض المنتجات -->
  <path d="M160 312h96M160 362h96" stroke="#E6EAF1" stroke-width="5"/>
  <g fill="#FFFFFF">
    <rect x="170" y="284" width="20" height="28" rx="3"/>
    <rect x="198" y="292" width="16" height="20" rx="3" opacity=".75"/>
    <rect x="224" y="280" width="22" height="32" rx="3"/>
    <rect x="176" y="338" width="26" height="24" rx="3" opacity=".75"/>
    <rect x="214" y="330" width="18" height="32" rx="3"/>
  </g>

  <!-- شاشة العرض -->
  <rect x="534" y="282" width="112" height="76" rx="4" fill="url(#screen)" stroke="#6B7489" stroke-width="5"/>
  <path d="M548 296h50l-34 48h-16z" fill="#FFFFFF" opacity=".08"/>

  <!-- منصة العرض الأرضية -->
  <rect x="166" y="412" width="54" height="58" fill="#E6EAF1"/>
  <rect x="180" y="390" width="26" height="22" rx="3" fill="#FFFFFF"/>

  <!-- كاونتر الاستقبال -->
  <rect x="285" y="372" width="230" height="98" rx="6" fill="url(#counter)"/>
  <rect x="275" y="360" width="250" height="14" rx="4" fill="#FFFFFF"/>
  <rect x="287" y="376" width="226" height="4" fill="#FFFFFF" filter="url(#glow)"/>
  <rect x="380" y="404" width="40" height="40" rx="8" fill="#208EC1"/>
  <rect x="394" y="414" width="12" height="20" rx="2" fill="#FFFFFF"/>

  <!-- أرضية الجناح المرتفعة -->
  <rect x="100" y="470" width="600" height="30" fill="#1B4A7A"/>
  <rect x="100" y="470" width="600" height="4" fill="#2E6496"/>

  <!-- هيكل التراس والكشافات -->
  <rect x="100" y="76" width="24" height="424" fill="url(#truss-v)" stroke="#C9CFDA" stroke-width="3"/>
  <rect x="676" y="76" width="24" height="424" fill="url(#truss-v)" stroke="#C9CFDA" stroke-width="3"/>
  <rect x="100" y="76" width="600" height="24" fill="url(#truss)" stroke="#C9CFDA" stroke-width="3"/>
  <g fill="#3A4255">
    <rect x="212" y="100" width="16" height="14" rx="3"/>
    <rect x="342" y="100" width="16" height="14" rx="3"/>
    <rect x="442" y="100" width="16" height="14" rx="3"/>
    <rect x="572" y="100" width="16" height="14" rx="3"/>
  </g>
  <g fill="#FFFFFF" filter="url(#glow)">
    <rect x="214" y="112" width="12" height="4" rx="2"/>
    <rect x="344" y="112" width="12" height="4" rx="2"/>
    <rect x="444" y="112" width="12" height="4" rx="2"/>
    <rect x="574" y="112" width="12" height="4" rx="2"/>
  </g>

  <!-- أرضية القاعة -->
  <rect y="500" width="800" height="100" fill="#071628"/>
  <rect y="500" width="800" height="4" fill="#1B4A7A"/>
  <ellipse cx="400" cy="514" rx="300" ry="10" fill="#FFFFFF" opacity=".12"/>
</svg>
