<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="شاحنة مغلّفة باستيكر بهوية الشركة وطرفه ينفصل">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071628"/>
      <stop offset="1" stop-color="#11345C"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EAF1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174273"/>
      <stop offset=".55" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#0F3054"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE9F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- صندوق الشاحنة المغلّف -->
  <rect x="230" y="150" width="500" height="280" rx="6" fill="url(#box)"/>
  <path d="M230 352L730 246V430H230z" fill="#208EC1"/>
  <path d="M230 340L730 234v16L230 356z" fill="#FFFFFF"/>
  <path d="M230 392L730 286v10L230 402z" fill="#176E99" opacity=".5"/>

  <!-- شعار بأسلوب الخط الكوفي المربع -->
  <g fill="#208EC1">
    <rect x="276" y="250" width="200" height="14" rx="3"/>
    <rect x="280" y="194" width="15" height="70" rx="3"/>
    <rect x="315" y="222" width="30" height="42" rx="5"/>
    <rect x="366" y="206" width="15" height="58" rx="3"/>
    <rect x="401" y="222" width="30" height="42" rx="5"/>
    <rect x="458" y="194" width="15" height="70" rx="3"/>
    <circle cx="330" cy="206" r="7"/>
    <circle cx="416" cy="206" r="7"/>
  </g>

  <!-- طرف الاستيكر ينفصل عن الصندوق -->
  <path d="M650 150h80v80z" fill="#8D96AB"/>
  <path d="M650 150l80 80H650z" fill="url(#flap)"/>
  <path d="M650 150l80 80" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M650 230h80" stroke="#071628" stroke-width="10" opacity=".18"/>

  <!-- أداة التركيب (المسّاحة) -->
  <g transform="rotate(-18 590 118)">
    <rect x="540" y="104" width="100" height="26" rx="6" fill="#FFFFFF"/>
    <rect x="540" y="126" width="100" height="8" rx="3" fill="#11345C"/>
  </g>

  <!-- الكابينة -->
  <path d="M230 250H140q-34 0-42 40l-18 112v28h150z" fill="#1B4A7A"/>
  <path d="M220 266h-74q-22 0-28 30l-8 38h110z" fill="url(#glass)"/>
  <path d="M132 276h40l-34 54h-22z" fill="#FFFFFF" opacity=".08"/>
  <rect x="86" y="396" width="28" height="12" rx="3" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- الهيكل والعجلات -->
  <rect x="80" y="428" width="660" height="18" fill="#3A4255"/>
  <g fill="#071628" stroke="#6B7489" stroke-width="8">
    <circle cx="170" cy="446" r="34"/>
    <circle cx="560" cy="446" r="34"/>
    <circle cx="650" cy="446" r="34"/>
  </g>
  <g fill="#C9CFDA">
    <circle cx="170" cy="446" r="10"/>
    <circle cx="560" cy="446" r="10"/>
    <circle cx="650" cy="446" r="10"/>
  </g>

  <!-- الأرضية -->
  <rect y="480" width="800" height="120" fill="#071628"/>
  <rect y="480" width="800" height="4" fill="#1B4A7A"/>
  <ellipse cx="410" cy="492" rx="320" ry="10" fill="#FFFFFF" opacity=".1"/>
</svg>
